name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Organize Folders
        run: |
          mkdir -p src/main/resources
          mkdir -p src/main/java/com/mymod
          [ -f fabric.mod.json ] && mv fabric.mod.json src/main/resources/
          [ -f MainMod.java ] && mv MainMod.java src/main/java/com/mymod/
      
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Build Mod
        run: gradle build
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Mod-Jar
          path: build/libs/*.jar
